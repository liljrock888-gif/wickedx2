<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wickedx2</title>
<meta name="description" content="Wickedx2: Roblox anime games, battlegrounds and gaming Shorts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Bangers&family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a manga page split down one vertical axis; every panel is mirrored across it. */
  :root{
    --paper:#fbfbf7; --ink:#0b0b0b; --tone:#d9d9d4; --mid:#6b6b66; --white:#ffffff; --gold:#c9a24a;
    --f-display:'Creepster','Bangers',Impact,fantasy;
    --f-sfx:'Bangers','Impact',sans-serif;
    --f-label:'Cinzel','Trajan Pro',Georgia,serif;
    --f-body:'Inter',system-ui,-apple-system,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.6;overflow-x:hidden;min-height:100vh}
  body::before{ /* mirrored halftone corners like screentone on a manga page */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(circle,rgba(11,11,11,.16) 1.2px,transparent 1.7px) 0 0/9px 9px;
    -webkit-mask:radial-gradient(ellipse at 0% 0%,#000,transparent 38%),radial-gradient(ellipse at 100% 0%,#000,transparent 38%),radial-gradient(ellipse at 0% 100%,#000,transparent 38%),radial-gradient(ellipse at 100% 100%,#000,transparent 38%);
            mask:radial-gradient(ellipse at 0% 0%,#000,transparent 38%),radial-gradient(ellipse at 100% 0%,#000,transparent 38%),radial-gradient(ellipse at 0% 100%,#000,transparent 38%),radial-gradient(ellipse at 100% 100%,#000,transparent 38%)}
  main{position:relative;z-index:1}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .label{font-family:var(--f-sfx);letter-spacing:.14em;font-size:18px;color:var(--ink);background:var(--ink);color:var(--white);padding:3px 12px 1px;display:inline-block;transform:skewX(-8deg)}
  :focus-visible{outline:3px solid var(--gold);outline-offset:4px}
  [hidden]{display:none!important}

  svg.skull{color:var(--ink)}
  .glow{animation:glow 3.5s ease-in-out infinite}
  @keyframes glow{0%,100%{color:var(--ink)}50%{color:#5a4410}}

  /* ---------- header ---------- */
  header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:4px solid var(--ink)}
  .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:74px}
  .bar nav{display:flex;gap:30px}
  .bar nav.l{justify-content:flex-end;padding-right:30px}
  .bar nav.r{justify-content:flex-start;padding-left:30px}
  .bar nav a{font-family:var(--f-sfx);font-size:21px;letter-spacing:.12em;text-decoration:none;color:var(--ink);transition:transform .15s}
  .bar nav a:hover{transform:translateY(-2px) scale(1.06)}
  .crest-link{position:relative;display:block;width:180px;height:74px;overflow:hidden;align-self:end}
  .crest-link .flames{position:absolute;left:0;bottom:0;width:100%;height:100%;overflow:visible}
  .flames path{fill:var(--ink);transform-box:fill-box;transform-origin:50% 100%;animation:flick var(--d,1.2s) ease-in-out var(--del,0s) infinite alternate}
  .flames path.core{fill:var(--white);animation-duration:calc(var(--d,1.2s) * .8)}
  @keyframes flick{
    0%{transform:scale(1,1) skewX(0)}
    35%{transform:scale(.94,1.16) skewX(var(--sk,3deg))}
    70%{transform:scale(1.05,.9) skewX(calc(var(--sk,3deg) * -1))}
    100%{transform:scale(.97,1.08) skewX(0)}}
  .crest-link .half{position:absolute;left:50%;top:-46px;width:96px;height:96px;margin-left:-48px;color:var(--ink);transition:transform .3s}
  .crest-link:hover .half{transform:translateY(5px)}

  /* ---------- hero: one big panel with speed lines ---------- */
  .hero{padding-block:34px 10px}
  .panel{position:relative;border:4px solid var(--ink);background:var(--white);box-shadow:8px 8px 0 var(--ink)}
  .hero .panel{text-align:center;padding:96px 20px 34px;overflow:hidden}
  .speed{position:absolute;inset:0;pointer-events:none;
    background:repeating-conic-gradient(from 0deg at 50% 30%,var(--ink) 0deg .9deg,transparent .9deg 5deg);
    -webkit-mask:radial-gradient(ellipse at 50% 30%,transparent 22%,#000 60%);mask:radial-gradient(ellipse at 50% 30%,transparent 22%,#000 60%);opacity:.9;animation:speed 2.4s steps(3) infinite}
  @keyframes speed{0%{transform:rotate(0)}33%{transform:rotate(.6deg)}66%{transform:rotate(-.6deg)}}
  .hero .inner{position:relative}
  .hero .crest{width:150px;height:150px;margin:0 auto 6px;display:block;animation:float 5s ease-in-out infinite;filter:drop-shadow(5px 5px 0 var(--ink))}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .name{position:relative;display:inline-block;font-family:var(--f-display);font-weight:400;font-size:clamp(70px,15vw,180px);line-height:.95;margin:6px 0 10px;white-space:nowrap;
    color:var(--ink);-webkit-text-stroke:6px var(--white);paint-order:stroke fill;text-shadow:7px 7px 0 var(--tone)}
  .namewrap{position:relative;display:inline-block;margin:6px 0 10px}
  .namewrap .name{margin:0;z-index:1}
  .burst{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0}
  .stripes{position:absolute;top:22%;display:flex;flex-direction:column;gap:9px;width:clamp(30px,5vw,60px)}
  .stripes span{display:block;height:clamp(6px,.9vw,10px);background:var(--white);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
  .stripes.left{right:calc(100% + 14px)}
  .stripes.right{left:calc(100% + 14px);transform-origin:left;transform:scaleX(0);transition:transform .7s cubic-bezier(.2,.9,.2,1)}
  .balanced .stripes.right{transform:scaleX(1)}
  .shudder{animation:shudder .45s linear 2}
  @keyframes shudder{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  .tagline{display:inline-block;max-width:560px;margin:6px auto 0;font-size:clamp(15px,2vw,18px);font-weight:600;background:var(--white);border:3px solid var(--ink);padding:10px 18px;position:relative}
  .twin{display:flex;justify-content:center;gap:18px;margin-top:28px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:210px;padding:13px 26px 11px;font-family:var(--f-sfx);font-size:22px;letter-spacing:.12em;text-decoration:none;border:3px solid var(--ink);background:var(--white);color:var(--ink);cursor:pointer;box-shadow:5px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
  .btn.solid{background:var(--ink);color:var(--white)}
  .btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
  .btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
  .btn.off{background:var(--tone);color:var(--mid);border-color:var(--mid);box-shadow:4px 4px 0 var(--mid);pointer-events:none}
  .symmetry{margin-top:26px;display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;font-family:var(--f-sfx);font-size:19px;letter-spacing:.1em;background:var(--white);border:3px solid var(--ink);padding:8px 14px;box-shadow:4px 4px 0 var(--ink)}
  .meter{width:150px;height:14px;border:3px solid var(--ink);position:relative;overflow:hidden;background:var(--white)}
  .meter b{position:absolute;left:0;top:0;bottom:0;width:66.6%;background:repeating-linear-gradient(45deg,var(--ink) 0 3px,transparent 3px 7px);transition:width .8s cubic-bezier(.2,.9,.2,1)}
  .balanced .meter b{width:100%;background:var(--ink)}
  .fix{font:inherit;letter-spacing:inherit;background:var(--gold);border:3px solid var(--ink);color:var(--ink);cursor:pointer;padding:2px 12px 0;box-shadow:3px 3px 0 var(--ink)}
  /* speech bubble */
  .bubble{position:absolute;font-family:var(--f-sfx);font-size:clamp(17px,2.2vw,24px);letter-spacing:.06em;background:var(--white);border:3px solid var(--ink);border-radius:50%;padding:16px 26px;line-height:1.05;text-align:center;box-shadow:4px 4px 0 var(--ink);transition:transform .3s}
  .bubble::after{content:"";position:absolute;width:22px;height:22px;background:var(--white);border:solid var(--ink);border-width:0 3px 3px 0;bottom:-11px}
  .bubble.l{left:3%;top:4%;transform:rotate(-6deg)}
  .bubble.l::after{right:26%;transform:rotate(45deg) skew(12deg,12deg)}
  .bubble.r{right:3%;top:4%;transform:rotate(6deg)}
  .bubble.r::after{left:26%;transform:rotate(45deg) skew(12deg,12deg)}

  /* ---------- sections ---------- */
  section{padding:80px 0 10px}
  .sec-head{text-align:center;margin-bottom:40px}
  .sec-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(52px,8vw,90px);line-height:1;margin:16px 0 10px;color:var(--white);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
  .sec-head p{color:var(--mid);max-width:560px;margin:0 auto;font-weight:500}

  .frame{position:relative;border:4px solid var(--ink);background:var(--white);box-shadow:6px 6px 0 var(--ink)}
  .tone{background:radial-gradient(circle,rgba(11,11,11,.22) 1.3px,transparent 1.8px) 0 0/8px 8px,var(--white)}

  .latest{max-width:880px;margin:0 auto}
  .latest .screen{aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}
  .latest iframe{width:100%;height:100%;border:0;display:block}
  .empty{text-align:center;display:grid;justify-items:center;gap:10px;padding:20px;position:relative}
  .empty svg{width:72px;height:72px;filter:drop-shadow(4px 4px 0 var(--ink))}
  .empty b{font-family:var(--f-sfx);letter-spacing:.1em;font-size:30px;background:var(--white);border:3px solid var(--ink);padding:4px 14px 0;box-shadow:4px 4px 0 var(--ink)}
  .empty span{font-weight:700;background:var(--white);padding:0 8px}

  .vids{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
  .vid{display:block;text-align:left;cursor:pointer;font:inherit;color:inherit;padding:0;transition:transform .15s,box-shadow .15s}
  .vid:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
  .vid .thumb{aspect-ratio:16/9;overflow:hidden;position:relative;border-bottom:4px solid var(--ink);display:grid;place-items:center}
  .vid img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .vid:hover img{transform:scale(1.05)}
  .vid .play{position:absolute;inset:0;display:grid;place-items:center}
  .vid .play span:not(.skullbtn){width:58px;height:58px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--white);box-shadow:3px 3px 0 var(--ink)}
  .vid .play svg{width:20px;height:20px;fill:var(--ink);margin-left:3px}
  .vid .cap{padding:9px 14px 7px;font-family:var(--f-sfx);font-size:20px;letter-spacing:.12em;text-align:center}
  .vid.soon{cursor:default}
  .vid.soon:hover{transform:none;box-shadow:6px 6px 0 var(--ink)}
  .vid.soon .thumb svg{width:46px;height:46px;filter:drop-shadow(3px 3px 0 var(--ink))}
  .vid.soon .numeral{position:absolute;bottom:4px;font-family:var(--f-display);font-size:30px;background:var(--white);padding:0 8px;border:2px solid var(--ink)}

  /* shorts layout: tall cards, vertical player */
  .shorts .vids{grid-template-columns:repeat(4,1fr)}
  .shorts .vid .thumb{aspect-ratio:9/16}
  .shorts .vid .cap{font-family:var(--f-body);font-weight:700;font-size:13.5px;letter-spacing:0;line-height:1.35;padding:10px 12px 12px;text-align:center;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(1.35em * 2 + 22px)}
  /* small rectangular cards with a skull play button */
  .shorts .vids{grid-template-columns:repeat(6,1fr);gap:16px}
  .shorts .vid .thumb{aspect-ratio:3/4}
  .shorts .vid{box-shadow:4px 4px 0 var(--ink);border-width:3px}
  .shorts .vid:hover{box-shadow:7px 7px 0 var(--ink)}
  .shorts .vid .thumb{border-bottom-width:3px}
  .shorts .vid .cap{font-size:12px;padding:8px 8px 9px;min-height:0;display:block;overflow:visible}
  .shorts .vid .cap span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:16px;height:32px}
  .skullbtn{position:relative;display:grid;place-items:center;width:74px;height:74px;margin-top:-10px;transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
  .vid .play .skullbtn svg{width:74px;height:74px;margin:0;fill:initial;color:var(--ink);overflow:visible;filter:drop-shadow(3px 3px 0 var(--ink)) drop-shadow(0 0 6px rgba(255,255,255,.9));transition:color .2s}
  .skullbtn i{position:absolute;bottom:-22px;font-style:normal;font-family:var(--f-sfx);font-size:14px;letter-spacing:.12em;background:var(--ink);color:var(--white);padding:2px 9px 0;border:2px solid var(--white);transform:rotate(-4deg)}
  .vid:hover .skullbtn{transform:scale(1.14) rotate(-6deg)}
  .vid:hover .play .skullbtn svg{color:#c9a24a}
  .shorts .player .box{width:auto;height:min(86vh,900px);aspect-ratio:9/16;max-width:100%}
  .about{max-width:700px;margin:0 auto;text-align:center;font-size:18px;line-height:1.75;font-weight:500;padding:28px 30px}
  .socials{display:flex;justify-content:center;gap:12px 18px;flex-wrap:wrap;margin-top:30px}
  .socials a{font-family:var(--f-sfx);font-size:20px;letter-spacing:.1em;text-decoration:none;border:3px solid var(--ink);padding:5px 14px 3px;box-shadow:3px 3px 0 var(--ink);background:var(--white)}
  .socials a:hover{background:var(--ink);color:var(--white)}
  .mail{margin-top:26px;font-weight:600}
  .mail code{font-family:var(--f-body);user-select:all;border-bottom:2px solid var(--ink)}
  .mail button{margin-left:10px;background:var(--white);border:2px solid var(--ink);font:inherit;font-size:13px;padding:3px 10px;cursor:pointer}

  footer{margin-top:90px;padding:34px 0 calc(42px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--white);text-align:center;border-top:4px solid var(--ink)}
  footer svg{width:40px;height:40px;margin-bottom:10px}
  footer svg.skull{color:var(--ink)}
  footer p{font-family:var(--f-sfx);font-size:18px;letter-spacing:.14em}
  footer a{text-decoration:none;border-bottom:2px solid var(--white)}

  .player{position:fixed;inset:0;z-index:50;background:rgba(11,11,11,.9);display:grid;place-items:center;padding:20px}
  .player .box{width:min(1000px,100%);aspect-ratio:16/9;border:4px solid var(--white)}
  .player iframe{width:100%;height:100%;border:0}
  .player .close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--white);border:3px solid var(--ink);color:var(--ink);font-family:var(--f-sfx);letter-spacing:.1em;font-size:20px;padding:6px 14px 4px;cursor:pointer}

  .from-l,.from-r{transition:transform .9s cubic-bezier(.2,.9,.2,1),opacity .9s}
  .pre .from-l{transform:translateX(-60px);opacity:.001}
  .pre .from-r{transform:translateX(60px);opacity:.001}

  .ghost{position:fixed;z-index:30;width:24px;height:24px;margin:-12px 0 0 -12px;pointer-events:none;opacity:0;transition:opacity .3s}
  .ghost svg{width:100%;height:100%}
  .ghost.on{opacity:.75}
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px) rotate(-3deg);opacity:0;z-index:60;background:var(--gold);color:var(--ink);font-family:var(--f-sfx);font-size:28px;letter-spacing:.08em;padding:10px 24px 6px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);transition:.35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0) rotate(-3deg)}

  @media (max-width:900px){
    .vids{grid-template-columns:repeat(2,1fr)}
    .shorts .vids{grid-template-columns:repeat(3,1fr)}
    .bar nav{gap:18px}.bar nav.l{padding-right:18px}.bar nav.r{padding-left:18px}
    .bubble{display:none}
  }
  @media (max-width:600px){
    .bar{height:62px}
    .bar nav a{font-size:16px;letter-spacing:.06em}
    .bar nav{gap:12px}.bar nav.l{padding-right:12px}.bar nav.r{padding-left:12px}
    .crest-link{width:120px;height:62px}
    .crest-link .half{width:76px;height:76px;margin-left:-38px;top:-37px}
    .hero .panel{padding:34px 14px 26px;box-shadow:5px 5px 0 var(--ink)}
    .hero .crest{width:110px;height:110px}
    .name{-webkit-text-stroke:4px var(--white);text-shadow:4px 4px 0 var(--tone)}
    .vids{gap:14px}
    .shorts .vids{grid-template-columns:repeat(2,1fr);gap:12px}
    .skullbtn,.vid .play .skullbtn svg{width:60px;height:60px}
    .btn{min-width:0;width:100%}
    .twin{flex-direction:column;align-items:stretch;max-width:320px;margin-left:auto;margin-right:auto}
    .symmetry{font-size:16px}
    .meter{width:110px}
    .ghost{display:none}
    .toast{white-space:normal;text-align:center;width:calc(100% - 40px)}
    .stripes.left{right:calc(100% + 6px)}.stripes.right{left:calc(100% + 6px)}
    .about{padding:20px 18px;font-size:16.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .pre .from-l,.pre .from-r{transform:none;opacity:1}
  }
</style>
</head>
<body class="pre">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="skull" viewBox="-4 -4 108 108">
    <g stroke="#0b0b0b" stroke-width="4" stroke-linejoin="round" fill="#ffffff">
      <path d="M33 13Q42 22 39 31Q33 34 28 30Q25 21 33 13Z"/>
      <path d="M67 13Q58 22 61 31Q67 34 72 30Q75 21 67 13Z"/>
      <path d="M50 1Q62 15 57 28Q50 33 43 28Q38 15 50 1Z"/>
      <path d="M50 22C30 22 18 36 18 53c0 10 5 17 12 21l3 14h34l3-14c7-4 12-11 12-21 0-17-12-31-32-31Z"/>
    </g>
    <path fill="#0b0b0b" d="M47 9Q53 17 50 25Q46 20 47 9Z"/>
    <path fill="currentColor" stroke="#0b0b0b" stroke-width="2.5" stroke-linejoin="round" d="M25 49L46 54L32 65Z"/>
    <path fill="currentColor" stroke="#0b0b0b" stroke-width="2.5" stroke-linejoin="round" d="M75 49L54 54L68 65Z"/>
    <path fill="#0b0b0b" d="M50 60l4.5 6.5L50 73l-4.5-6.5z"/>
    <path fill="none" stroke="#0b0b0b" stroke-width="3" stroke-linecap="round" d="M35 80Q50 85 65 80M40 77v7M45 78.5v7M50 79v7M55 78.5v7M60 77v7"/>
  </symbol>
  <symbol id="playicon" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
</svg>

<main>
  <header class="top">
    <div class="wrap bar">
      <nav class="l" aria-label="Primary left"><a href="#videos">Videos</a><a href="#about">About</a></nav>
      <a class="crest-link" href="#top" aria-label="Back to top">
        <svg class="flames" id="flames" viewBox="0 0 180 74" preserveAspectRatio="xMidYMax meet" aria-hidden="true"></svg>
        <svg class="skull half" aria-hidden="true"><use href="#skull"/></svg>
      </a>
      <nav class="r" aria-label="Primary right"><a href="#contact">Contact</a><a id="navSub" href="#" target="_blank" rel="noopener">Subscribe</a></nav>
    </div>
  </header>

  <div class="wrap hero" id="top">
    <div class="panel">
      <div class="speed" aria-hidden="true"></div>
      <div class="bubble l" id="bubL" aria-hidden="true">Something's<br>off...</div>
      <div class="bubble r" id="bubR" aria-hidden="true">It's not<br>balanced!</div>
      <div class="inner">
        <div class="namewrap"><canvas class="burst" id="burst" aria-hidden="true"></canvas><h1 class="name" id="name"><span id="chName">Wickedx2</span></h1></div>
        <div><p class="tagline" id="tagline"></p></div>
        <div class="twin">
          <a class="btn solid from-l" id="subBtn" href="#" target="_blank" rel="noopener">Subscribe</a>
          <a class="btn from-r" href="#videos">Watch videos</a>
        </div>
        <div class="symmetry">
          <span>Symmetry</span><span class="meter" aria-hidden="true"><b></b></span><span id="symPct">66.6%</span>
          <button class="fix" id="fix" type="button">Fix it!</button>
        </div>
      </div>
    </div>
  </div>

  <section id="videos">
    <div class="wrap">
      <div class="sec-head">
        <span class="label">On the channel</span>
        <h2>Latest Upload</h2>
      </div>
      <div class="latest frame tone from-l"><div class="screen" id="latest"></div></div>
      <div class="vids" id="vids"></div>
    </div>
  </section>

  <section id="about">
    <div class="wrap">
      <div class="sec-head"><span class="label">The channel</span><h2>About</h2></div>
      <p class="about frame" id="aboutText"></p>
    </div>
  </section>

  <section id="contact">
    <div class="wrap" style="text-align:center">
      <div class="sec-head"><span class="label">Find me</span><h2>Contact</h2><p>Business, collabs or just saying hi.</p></div>
      <div class="twin">
        <a class="btn solid from-l" id="ytBtn" href="#" target="_blank" rel="noopener">YouTube</a>
        <a class="btn from-r" id="dcBtn" href="#" target="_blank" rel="noopener">Discord</a>
      </div>
      <p class="mail" id="mail" hidden>Business email: <code id="mailAddr"></code><button type="button" id="copyMail">Copy</button></p>
      <div class="socials" id="socials"></div>
    </div>
  </section>

  <footer>
    <svg class="skull" aria-hidden="true"><use href="#skull"/></svg>
    <p>© <span id="yr">2026</span> <span id="footName">Wickedx2</span> · Site by <a href="https://liljrock888-gif.github.io/timid-studio/" target="_blank" rel="noopener">Timid Studio</a></p>
  </footer>
</main>

<div class="player" id="player" hidden><button class="close" id="closePlayer" type="button">Close ✕</button><div class="box" id="playerBox"></div></div>
<div class="ghost" id="ghost" aria-hidden="true"><svg class="skull"><use href="#skull"/></svg></div>
<div class="toast" id="toast" role="status"></div>

<script src="content.js"></script>
<script>
  const C = (typeof CHANNEL !== 'undefined') ? CHANNEL : {name:'Wickedx2',socials:{}};
  const V = (typeof VIDEOS !== 'undefined') ? VIDEOS : [];
  const $ = id => document.getElementById(id);
  const skull = '<svg class="skull" aria-hidden="true"><use href="#skull"/></svg>';
  const ytId = u => { const m = String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/); return m ? m[1] : null; };
  const yt = C.socials && C.socials.youtube || (C.handle ? 'https://www.youtube.com/' + C.handle : '');

  // channel text
  $('chName').textContent = C.name; $('footName').textContent = C.name; document.title = C.name;
  $('tagline').textContent = C.tagline || '';
  $('aboutText').textContent = C.about || '';
  $('subBtn').href = $('navSub').href = yt ? yt + '?sub_confirmation=1' : '#';
  $('ytBtn').href = yt || '#';
  if (C.discord) $('dcBtn').href = C.discord; else $('dcBtn').hidden = true;
  if (C.email) { $('mail').hidden = false; $('mailAddr').textContent = C.email; }
  $('copyMail').onclick = () => { navigator.clipboard?.writeText(C.email).then(() => say('Email copied'), () => {}); };
  const names = {youtube:'YouTube',tiktok:'TikTok',instagram:'Instagram',twitch:'Twitch',x:'X'};
  $('socials').innerHTML = Object.entries(C.socials || {}).filter(([,u]) => u).map(([k,u]) => `<a href="${u}" target="_blank" rel="noopener">${names[k] || k}</a>`).join('');

  // latest upload: channel uploads playlist (auto) > newest listed video > empty frame
  const vids = V.map(v => typeof v === 'string' ? {link:v} : v).map(v => ({...v, id: ytId(v.link)})).filter(v => v.id);
  const ids = vids.map(v => v.id);
  const SHORTS = C.layout === 'shorts';
  if (SHORTS) document.body.classList.add('shorts');
  const latest = $('latest');
  if (C.channelId && /^UC[\w-]{22}$/.test(C.channelId)) {
    latest.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=UU${C.channelId.slice(2)}" title="Latest uploads" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  } else if (ids[0]) {
    latest.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${ids[0]}" title="Latest video" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  } else {
    latest.innerHTML = `<div class="empty">${skull}<b>New video incoming</b><span>Subscribe so you don't miss it.</span></div>`;
  }

  // archive: listed videos, or six mirrored "coming soon" slots
  const R = ['I','II','III','IV','V','VI'];
  $('vids').innerHTML = ids.length
    ? vids.slice(C.channelId ? 0 : 1).map(({id, title}, i) => `<button class="vid frame ${i % 4 < 2 ? 'from-l' : 'from-r'}" type="button" data-id="${id}">
        <div class="thumb"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"><div class="play"><span class="skullbtn"><svg class="skull" aria-hidden="true"><use href="#skull"/></svg><i>Play</i></span></div></div>
        <div class="cap"><span>${title ? title.replace(/[<>&"]/g, '') : 'Watch'}</span></div></button>`).join('')
    : R.map((n, i) => `<div class="vid frame tone soon ${i % 3 === 0 ? 'from-l' : i % 3 === 2 ? 'from-r' : ''}"><div class="thumb">${skull}<span class="numeral">${n}</span></div><div class="cap">Coming soon</div></div>`).join('');
  $('vids').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) openPlayer(b.dataset.id); });
  function openPlayer(id){
    $('playerBox').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" title="Video player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    $('player').hidden = false;
  }
  function closePlayer(){ $('player').hidden = true; $('playerBox').innerHTML = ''; }
  $('closePlayer').onclick = closePlayer;
  $('player').addEventListener('click', e => { if (e.target.id === 'player') closePlayer(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });

  // comic halftone burst: big dots hug the name, shrinking as they spread out
  function drawBurst(){
    const cv = document.getElementById('burst'), nm = document.getElementById('name'); if (!cv || !nm) return;
    const w = Math.round(nm.offsetWidth * 1.45 + 80), h = Math.round(nm.offsetHeight * 2.3 + 40), dpr = devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
    const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, rx = w / 2, ry = h / 2;
    // soft white base so the dots sit on clean paper, not on the speed lines
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, rx);
    grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(.62, 'rgba(255,255,255,.95)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.save(); g.translate(cx, cy); g.scale(1, ry / rx); g.fillStyle = grad; g.beginPath(); g.arc(0, 0, rx, 0, Math.PI * 2); g.fill(); g.restore();
    const step = Math.max(9, Math.round(nm.offsetHeight / 13)), maxR = step * .46;
    g.fillStyle = '#0b0b0b';
    for (let y = step / 2; y < h; y += step) {
      const shift = (Math.round(y / step) % 2) * step / 2;          // offset rows like real screentone
      for (let x = step / 2 + shift; x < w; x += step) {
        const d = Math.hypot((x - cx) / rx, (y - cy) / ry);           // 0 at center, 1 at the edge
        if (d > .98) continue;
        const r = maxR * Math.pow(Math.max(0, 1 - d), .9) * (d < .3 ? d / .3 : 1);  // fade out under the letters too
        if (r > .5) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
      }
    }
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(drawBurst);
  let bt; addEventListener('resize', () => { clearTimeout(bt); bt = setTimeout(drawBurst, 150); });

  // mirrored entrance
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('pre')));

  // symmetry easter egg
  const hero = document.querySelector('.hero'), nameEl = $('name'), toast = $('toast');
  function say(t){ toast.textContent = t; toast.classList.add('show'); clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove('show'), 2600); }
  $('fix').addEventListener('click', () => {
    if (hero.classList.contains('balanced')) return say('ALREADY PERFECT!');
    nameEl.classList.add('shudder');
    setTimeout(() => { nameEl.classList.remove('shudder'); hero.classList.add('balanced');
      $('symPct').textContent = '100%'; $('fix').textContent = 'Perfect!'; $('bubL').innerHTML = 'Perfect<br>symmetry!'; $('bubR').innerHTML = 'Beautiful.<br>Balanced.'; say('PERFECT SYMMETRY!'); }, 900);
  });

  // mirror cursor
  const ghost = $('ghost');
  if (matchMedia('(pointer: fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    addEventListener('mousemove', e => { ghost.style.left = (innerWidth - e.clientX) + 'px'; ghost.style.top = e.clientY + 'px'; ghost.classList.add('on'); });
    document.addEventListener('mouseleave', () => ghost.classList.remove('on'));
  }
  $('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
